<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivHub — Login</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex items-center justify-center min-h-screen p-4">

  <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-8 shadow-sm">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto rounded bg-brand-600 text-white flex items-center justify-center font-bold text-xl mb-4 shadow-sm">
        <i class="fas fa-building-columns"></i>
      </div>
      <h1 id="auth-title" class="font-bold text-2xl text-slate-900 tracking-tight">Sign in to CivHub</h1>
      <p id="auth-subtitle" class="text-sm text-slate-500 mt-2">Use your institutional G-Suite account.</p>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="hidden mb-6 p-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium flex items-start gap-3 transition-all">
      <i class="fas fa-exclamation-circle mt-0.5"></i>
      <span id="error-text"></span>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Institutional Email</label>
        <div class="relative">
          <i class="fas fa-envelope absolute left-3.5 top-3 text-slate-400"></i>
          <input type="email" id="email" required placeholder="yourname@ce.iitr.ac.in" 
                 class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-brand-500 focus:border-brand-500 transition-shadow text-slate-900">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <i class="fas fa-lock absolute left-3.5 top-3 text-slate-400"></i>
          <input type="password" id="password" required placeholder="••••••••" 
                 class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-brand-500 focus:border-brand-500 transition-shadow text-slate-900">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 mt-2">
        Authenticate
      </button>

      <!-- Divider -->
      <div class="relative flex items-center py-2">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-semibold">OR</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- Google Sign-In Button -->
      <button type="button" id="google-login-btn" class="w-full py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-lg shadow-sm transition-colors flex items-center justify-center gap-3">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-4 h-4">
        Sign in with Google
      </button>
      
      <!-- Mode Toggle -->
      <div class="text-center mt-4">
        <p class="text-sm text-slate-500">
          <span id="toggle-text">Don't have an account?</span> 
          <button type="button" id="toggle-auth-btn" class="text-brand-600 font-semibold hover:text-brand-700 transition-colors">Sign Up</button>
        </p>
      </div>
    </form>
  </div>

  <!-- Import the JS module -->
  <script type="module" src="login.js"></script>
</body>
</html>
