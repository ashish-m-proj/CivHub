<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderation Queue — CivHub</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
            sidebar: '#0f172a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:text-slate-200 dark:bg-slate-950 dark:bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] dark:from-purple-900/40 dark:via-[#0f0a18] dark:to-[#020617] antialiased min-h-screen flex flex-col transition-colors duration-300">

  <!-- Header -->
  <header class="h-16 bg-white dark:bg-white/[0.02] dark:backdrop-blur-3xl border-b border-slate-200 dark:border-white/10 flex items-center justify-between px-8 sticky top-0 z-30 shrink-0 transition-colors">
    <div class="flex items-center gap-4">
      <a href="index.html" class="w-8 h-8 rounded bg-brand-600 text-white flex items-center justify-center font-bold text-sm hover:bg-brand-700 transition-colors">
        <i class="fas fa-building-columns"></i>
      </a>
      <div class="hidden sm:flex items-center gap-2 text-sm">
        <a href="index.html" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">Dashboard</a>
        <span class="text-slate-400">/</span>
        <span class="font-medium text-slate-900 dark:text-white">Moderation Queue</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <a href="index.html" class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors mr-2">
        <i class="fas fa-arrow-left mr-1"></i> Back to Hub
      </a>

      <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-2"></div>

      <button id="theme-toggle" class="relative text-slate-500 dark:text-slate-400 hover:text-purple-600 dark:hover:text-[#d8b4fe] transition-colors p-2 rounded-full hover:bg-slate-100 dark:hover:bg-[#2b1045] flex items-center justify-center">
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 transition-transform duration-300 hover:-rotate-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 transition-transform duration-500 hover:rotate-90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-6 flex justify-center">
    <div class="w-full max-w-5xl py-8">

      <!-- Gate states -->
      <div id="checking-access" class="text-center py-24">
        <i class="fas fa-spinner fa-spin text-3xl text-brand-500"></i>
        <p class="text-slate-500 dark:text-slate-400 mt-4">Checking access...</p>
      </div>

      <div id="access-denied" class="hidden text-center py-24">
        <i class="fas fa-lock text-3xl text-rose-500 mb-4"></i>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Admin Access Required</h2>
        <p class="text-slate-500 dark:text-slate-400 mt-2">This page is restricted to CivHub moderators.</p>
        <a href="index.html" class="inline-block mt-6 px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg transition-colors text-sm">Back to Dashboard</a>
      </div>

      <!-- Main content -->
      <div id="moderation-content" class="hidden">
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Moderation Queue</h1>
          <p class="text-slate-500 dark:text-slate-400 mt-2">Review pending submissions before they go live.</p>
        </div>

        <div id="empty-state" class="hidden bg-white dark:bg-white/[0.03] border border-slate-200 dark:border-white/10 rounded-2xl p-12 text-center">
          <i class="fas fa-check-circle text-3xl text-emerald-500 mb-3"></i>
          <p class="text-slate-500 dark:text-slate-400">Nothing pending — queue is clear.</p>
        </div>

        <div id="queue-list" class="space-y-4"></div>
      </div>

    </div>
  </main>

  <script type="module" src="moderation.js"></script>
</body>
</html>
